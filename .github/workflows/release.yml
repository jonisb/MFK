name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: refs/heads/master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update addon.xml from the release tag
        run: |
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" HEAD ||
             ! git diff --quiet "$tag_commit" HEAD -- . ':(exclude)plugin.video.mfk/addon.xml'; then
            echo "Error: tag must be cut from master without later source changes" >&2
            exit 1
          fi
          python3 tools/build_release.py --tag "$GITHUB_REF_NAME" --update-addon-xml-only

      - name: Commit and push addon.xml to master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add plugin.video.mfk/addon.xml
          if git diff --cached --quiet -- plugin.video.mfk/addon.xml; then
            echo 'addon.xml already has the release version; skipping commit and push.'
          else
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "${GITHUB_SHA}^{commit}")" ]; then
              echo "Error: master advanced since the tag; not overwriting addon.xml" >&2
              exit 1
            fi
            git commit -m "Bump addon version for $GITHUB_REF_NAME" -- plugin.video.mfk/addon.xml
            git push origin HEAD:refs/heads/master
          fi

      - name: Build addon release zip
        id: build
        run: |
          python3 tools/build_release.py --outdir dist
          version="${GITHUB_REF_NAME#v}"
          zip_path="dist/plugin.video.mfk-${version}.zip"
          test -f "$zip_path" || { echo "Error: expected release zip not found: $zip_path" >&2; exit 1; }
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip_path }}
          generate_release_notes: true
